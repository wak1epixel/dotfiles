config-version = 2

start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

persistent-workspaces = ['1', '2', '3', '4', '5']

exec-on-workspace-change = ['/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.right      = 10
outer.top        = 10
outer.bottom     = 10

[mode.main.binding]
alt-enter = 'exec-and-forget open -n -a kitty'
alt-w     = 'exec-and-forget /bin/bash -c "MOZ_DISABLE_SAFE_MODE_KEY=1 /Applications/Firefox.app/Contents/MacOS/firefox --new-window"'
alt-e     = 'exec-and-forget open -a Finder'
alt-q     = 'exec-and-forget /Users/Dwayne/.config/aerospace/quit-focused.sh'

alt-left  = 'focus left'
alt-down  = 'focus down'
alt-up    = 'focus up'
alt-right = 'focus right'

alt-shift-left  = 'move left'
alt-shift-down  = 'move down'
alt-shift-up    = 'move up'
alt-shift-right = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

alt-shift-space = 'layout floating tiling'
alt-shift-c = 'reload-config'
